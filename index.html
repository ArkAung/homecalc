<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Price Calculator (MM)</title>
    <style>
        /* High-standard Myanmar Unicode font stack */
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap');

        :root {
            --primary-color: #0056b3;
            --secondary-color: #28a745;
            --bg-color: #f1f3f5;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --danger-color: #dc3545;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Pyidaungsu', 'Padauk', 'Myanmar Sans Serif', 'Myanmar Text', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            line-height: 1.6;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
            color: var(--primary-color);
            font-weight: 700;
        }

        .area-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #e7f1ff;
            color: var(--primary-color);
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: bold;
            margin-top: 12px;
            cursor: pointer;
            border: 1px solid rgba(0, 86, 179, 0.1);
        }

        .edit-area-input {
            display: none;
            width: 160px;
            margin: 10px auto;
            padding: 10px;
            border: 2px solid var(--primary-color);
            border-radius: 12px;
            text-align: center;
            font-size: 1.2rem;
            font-family: inherit;
        }

        .section-label {
            display: block;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .quick-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .quick-btn {
            background: #fff;
            border: 2px solid #dee2e6;
            padding: 14px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .custom-input-wrapper {
            margin-bottom: 25px;
        }

        input[type="number"] {
            width: 100%;
            padding: 18px;
            font-size: 1.4rem;
            border: 2px solid #ced4da;
            border-radius: 14px;
            outline: none;
            font-family: inherit;
        }

        .rate-info-box {
            background: #fff9db;
            border: 1px dashed #f08c00;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 1rem;
            margin-bottom: 12px;
            font-weight: bold;
            color: #856404;
        }

        .rate-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .results-display {
            background: #212529;
            color: white;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 15px;
        }

        .res-row {
            margin-bottom: 20px;
        }

        .res-row:last-child {
            margin-bottom: 0;
            padding-top: 15px;
            border-top: 1px solid #444;
        }

        .res-label {
            font-size: 0.95rem;
            color: #adb5bd;
            display: block;
            margin-bottom: 6px;
        }

        .res-val-primary {
            font-size: 1.8rem;
            font-weight: bold;
            display: block;
            line-height: 1.3;
        }

        .res-val-secondary {
            font-size: 1.1rem;
            color: #40c057;
            font-weight: bold;
            display: block;
        }

        .save-btn {
            width: 100%;
            padding: 18px;
            background: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }

        .save-btn:active {
            transform: scale(0.98);
        }

        /* History Table Styles */
        .history-card {
            overflow-x: auto;
        }

        .history-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 600px;
        }

        th {
            text-align: left;
            padding: 10px;
            border-bottom: 2px solid #eee;
            color: var(--text-muted);
            font-weight: bold;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        .delete-btn {
            color: var(--danger-color);
            background: #ffe3e3;
            border: none;
            font-weight: bold;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
        }

        .pencil-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .table-val-bold {
            font-weight: bold;
            color: var(--text-main);
        }

        .table-val-sub {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>

    <div class="app-container">
        <div class="card">
            <header>
                <h1>အိမ်ခြံမြေ တွက်စက်</h1>
                <div class="area-badge" onclick="toggleAreaEdit()">
                    <span id="areaText">စုစုပေါင်း: ၁၂,၇၀၀ စတုရန်းပေ</span>
                    <svg class="pencil-icon" viewBox="0 0 24 24">
                        <path
                            d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
                    </svg>
                </div>
                <input type="number" id="areaInput" class="edit-area-input" value="12700"
                    oninput="updateArea(this.value)" onblur="this.style.display='none'">
            </header>

            <span class="section-label">၁ ပေ ပတ်လည် ဈေးနှုန်း ရွေးရန်</span>
            <div class="quick-grid">
                <button class="quick-btn" onclick="setQuickPrice(400000, this)">၄ သိန်း</button>
                <button class="quick-btn" onclick="setQuickPrice(500000, this)">၅ သိန်း</button>
                <button class="quick-btn" onclick="setQuickPrice(600000, this)">၆ သိန်း</button>
                <button class="quick-btn" onclick="setQuickPrice(1000000, this)">၁၀ သိန်း</button>
            </div>

            <div class="custom-input-wrapper">
                <span class="section-label">ကိုယ်တိုင်ရိုက်ထည့်ရန်</span>
                <input type="number" id="priceInput" placeholder="ဥပမာ - ၄၅၀၀၀၀" inputmode="decimal"
                    oninput="updateCalculation()">
            </div>

            <span class="section-label">ငွေလဲနှုန်း (၁ ဒေါ်လာ)</span>
            <div class="rate-info-box" id="rateInfo">1 USD = ၄,၀၀၀ ကျပ်</div>
            <div class="rate-selector">
                <button class="quick-btn active" onclick="setRate(4000, this)">၄၀၀၀</button>
                <button class="quick-btn" onclick="setRate(4500, this)">၄၅၀၀</button>
                <button class="quick-btn" onclick="setRate(5000, this)">၅၀၀၀</button>
            </div>

            <div class="results-display">
                <div class="res-row">
                    <span class="res-label">စုစုပေါင်း ကျသင့်ငွေ</span>
                    <span class="res-val-primary" id="mmText">၀ သိန်း</span>
                </div>
                <div class="res-row">
                    <span class="res-label">USD ဖြင့် တွက်ချက်မှု</span>
                    <span class="res-val-primary" id="usdText">$0.00</span>
                    <span class="res-val-secondary" id="usdReadable">0.00 million</span>
                </div>
            </div>

            <button class="save-btn" onclick="saveCalculation()">တွက်ချက်မှု သိမ်းဆည်းရန်</button>
        </div>

        <div class="card history-card" id="historySection" style="display: none;">
            <div class="history-title">
                <span>သိမ်းဆည်းထားသည်များ</span>
                <button onclick="clearAll()"
                    style="font-size: 0.8rem; background: #eee; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">အားလုံးဖြတ်ရန်</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ဧရိယာ (ပေ)</th>
                        <th>၁ပေဈေး</th>
                        <th>Rate</th>
                        <th>ကျပ်ငွေ</th>
                        <th>USD</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let totalSqft = 12700;
        let selectedRate = 4000;
        const mmNumerals = ['၀', '၁', '၂', '၃', '၄', '၅', '၆', '၇', '၈', '၉'];

        function toMyanmarDigits(num) {
            if (num === null || num === undefined) return '';
            return num.toString().split('').map(d => mmNumerals[d] || d).join('');
        }

        function formatBurmeseCurrency(amount) {
            if (amount === 0) return "၀ ကျပ်";
            let lakh = Math.floor(amount / 100000);
            let remainder = amount % 100000;
            let result = "";
            if (lakh > 0) result += toMyanmarDigits(lakh.toLocaleString()) + " သိန်း ";
            if (remainder > 0) result += toMyanmarDigits(remainder.toLocaleString()) + " ကျပ်";
            return result.trim() || "၀ ကျပ်";
        }

        function formatUSDReadable(amount) {
            if (amount === 0) return "0.00 million";
            if (amount >= 1000000) return (amount / 1000000).toFixed(2) + " million";
            if (amount >= 1000) return (amount / 1000).toFixed(1) + " thousand";
            return amount.toFixed(2);
        }

        function toggleAreaEdit() {
            const input = document.getElementById('areaInput');
            input.style.display = 'block';
            input.focus();
        }

        function updateArea(val) {
            totalSqft = parseFloat(val) || 0;
            document.getElementById('areaText').innerText = `စုစုပေါင်း: ${toMyanmarDigits(totalSqft.toLocaleString())} စတုရန်းပေ`;
            updateCalculation();
        }

        function setQuickPrice(val, btn) {
            document.getElementById('priceInput').value = val;
            document.querySelectorAll('.quick-grid .quick-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateCalculation();
        }

        function setRate(rate, btn) {
            selectedRate = rate;
            document.getElementById('rateInfo').innerText = `1 USD = ${toMyanmarDigits(rate.toLocaleString())} ကျပ်`;
            document.querySelectorAll('.rate-selector .quick-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateCalculation();
        }

        function updateCalculation() {
            const priceVal = parseFloat(document.getElementById('priceInput').value) || 0;
            const totalMMK = priceVal * totalSqft;
            const totalUSD = totalMMK / selectedRate;

            document.getElementById('mmText').innerText = formatBurmeseCurrency(totalMMK);
            document.getElementById('usdText').innerText = new Intl.NumberFormat('en-US', {
                style: 'currency', currency: 'USD'
            }).format(totalUSD);
            document.getElementById('usdReadable').innerText = formatUSDReadable(totalUSD);
        }

        function saveCalculation() {
            const priceVal = parseFloat(document.getElementById('priceInput').value) || 0;
            if (priceVal === 0) return;

            const totalMMK = priceVal * totalSqft;
            const totalUSD = totalMMK / selectedRate;

            const entry = {
                id: Date.now(),
                area: totalSqft,
                pricePerSqft: priceVal,
                rate: selectedRate,
                mmk: formatBurmeseCurrency(totalMMK),
                usdReadable: formatUSDReadable(totalUSD),
                usdFull: new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(totalUSD)
            };

            let history = JSON.parse(localStorage.getItem('property_history') || '[]');
            history.unshift(entry);
            localStorage.setItem('property_history', JSON.stringify(history));
            renderHistory();
        }

        function deleteEntry(id) {
            let history = JSON.parse(localStorage.getItem('property_history') || '[]');
            history = history.filter(e => e.id !== id);
            localStorage.setItem('property_history', JSON.stringify(history));
            renderHistory();
        }

        function clearAll() {
            if (confirm("အားလုံးကို ပယ်ဖျက်မှာ သေချာပါသလား?")) {
                localStorage.removeItem('property_history');
                renderHistory();
            }
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('property_history') || '[]');
            const container = document.getElementById('historySection');
            const body = document.getElementById('historyBody');

            body.innerHTML = '';

            if (history.length === 0) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'block';
            history.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                <td>${toMyanmarDigits(item.area.toLocaleString())}</td>
                <td>${toMyanmarDigits(item.pricePerSqft.toLocaleString())}</td>
                <td>${toMyanmarDigits(item.rate.toLocaleString())}</td>
                <td class="table-val-bold">${item.mmk}</td>
                <td>
                    <span class="table-val-bold">${item.usdFull}</span>
                    <span class="table-val-sub">(${item.usdReadable})</span>
                </td>
                <td><button class="delete-btn" onclick="deleteEntry(${item.id})">ဖြတ်ရန်</button></td>
            `;
                body.appendChild(row);
            });
        }

        window.onload = renderHistory;
    </script>

</body>

</html>
